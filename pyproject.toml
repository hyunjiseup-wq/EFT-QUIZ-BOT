[project]
name = "tarkov-quiz-bot"
version = "0.1.0"
description = "Discord button-based Escape from Tarkov quiz bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4.0",
    "python-dotenv>=1.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
