name: Quiz bot checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and checks
        run: python -m pip install . "ruff>=0.12.0,<1.0.0"

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      - name: Validate question bank
        run: python check_questions.py

      - name: Compile Python sources
        run: >-
          python -m py_compile admin_log.py bot.py config.py dashboard_icon_installer.py
          dashboard_installation.py database.py dashboard_manager.py interaction_access.py question_bank.py quiz_completion.py quiz_icons.py quiz_lifecycle.py
          quiz_presenters.py quiz_reports.py quiz_scoring.py quiz_session.py check_questions.py

      - name: Run Ruff
        run: ruff check .
